name: Publish to npm

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run verify:package
      - name: Match git tag to package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          test "$tag" = "$version"
      - run: bun scripts/set-publish-metadata.ts
      - run: npm install -g npm@latest
      - id: npm
        name: Check the actual version before publishing
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          code="$(curl -sS --max-time 30 -H 'Cache-Control: no-cache' -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/${name}/${version}")"
          case "$code" in
            200) echo "exists=true" >> "$GITHUB_OUTPUT"; echo "This version is already on npm; skipping publish." ;;
            404) echo "exists=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "npm version lookup failed (HTTP $code)" >&2; exit 1 ;;
          esac
      - if: steps.npm.outputs.exists == 'false'
        run: npm publish
