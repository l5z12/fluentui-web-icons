name: Sync icons

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-icons
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: check
        run: bun scripts/check-upstream.ts
      - if: steps.check.outputs.release != 'true'
        run: echo "Already in sync with @fluentui/svg-icons ${{ steps.check.outputs.latest }}"
      - if: steps.check.outputs.release == 'true' && steps.check.outputs.update_dependency == 'true'
        run: bun update @fluentui/svg-icons --latest
      - if: steps.check.outputs.release == 'true'
        run: bun scripts/prepare-icon-release.ts
      - if: steps.check.outputs.release == 'true'
        run: bun run test
      - if: steps.check.outputs.release == 'true'
        run: bun run verify:package
      - if: steps.check.outputs.release == 'true'
        run: |
          version="$(node -p "require('./package.json').version")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock CHANGELOG.md README.md
          git diff --cached --quiet || git commit -m "Sync icons from @fluentui/svg-icons ${version}"
          git rev-parse "v${version}" >/dev/null 2>&1 || git tag "v${version}"
          git push origin "HEAD:refs/heads/${{ github.event.repository.default_branch }}"
          git push origin "v${version}"
      - if: steps.check.outputs.listed != 'true'
        run: echo "The first npm release must be published from a maintainer machine. Automated publish stays off until the package exists and trusted publishers are configured."
      - if: steps.check.outputs.release == 'true'
        run: bun scripts/set-publish-metadata.ts
      - if: steps.check.outputs.release == 'true'
        run: npm install -g npm@latest
      - if: steps.check.outputs.release == 'true'
        run: npm publish
