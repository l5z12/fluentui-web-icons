name: Sync icons

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: sync-icons
  cancel-in-progress: false

permissions:
  contents: write
  actions: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - id: check
        run: bun scripts/check-upstream.ts
      - if: steps.check.outputs.release != 'true'
        run: echo "Already in sync with @fluentui/svg-icons ${{ steps.check.outputs.latest }}"
      - if: steps.check.outputs.release == 'true' && steps.check.outputs.update_dependency == 'true'
        run: bun update @fluentui/svg-icons --latest
      - if: steps.check.outputs.release == 'true'
        run: bun scripts/prepare-icon-release.ts
      - if: steps.check.outputs.release == 'true'
        run: bun run test
      - if: steps.check.outputs.release == 'true'
        run: bun run verify:package
      - if: steps.check.outputs.release == 'true'
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.release == 'true'
        uses: siiway/verified_bot_commit@v0
        with:
          ref: ${{ github.event.repository.default_branch }}
          message: "icons: sync from @fluentui/svg-icons ${{ steps.version.outputs.version }}"
          if-no-commit: info
          files: |
            package.json
            bun.lock
            CHANGELOG.md
            README.md
      - if: steps.check.outputs.release == 'true'
        run: |
          version="${{ steps.version.outputs.version }}"
          git rev-parse "v${version}" >/dev/null 2>&1 || git tag "v${version}"
          git push origin "v${version}"
      - if: steps.check.outputs.listed != 'true'
        run: echo "The first npm release must be published from a maintainer machine. Automated publish stays off until the package exists and trusted publishers are configured."
      - if: steps.check.outputs.release == 'true'
        run: bun scripts/set-publish-metadata.ts
      - if: steps.check.outputs.release == 'true'
        run: npm install -g npm@latest
      - if: steps.check.outputs.release == 'true'
        run: npm publish
      - if: steps.check.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run "Deploy explorer" --repo "${{ github.repository }}" --ref "${{ github.event.repository.default_branch }}"
